{{ define "main" }}
  {{ range sort .Paginator.Pages }}
  <article class="markdown book-post">
    <h2>
      <a href="{{ .RelPermalink }}">{{ partial "title.html" . }}</a>
    </h2>
    {{- partial "posts/meta" . -}}
    <p>
      {{- .Summary -}}
      {{ if .Truncated }}
        <a href="{{ .RelPermalink }}">...</a>
      {{ end }}
    </p>
  </article>
  {{ end }}

  {{- partial "pagination.html" . -}}
{{ end }}

{{ define "toc" }}
  {{- partial "posts/taxonomy" . -}}
{{ end }}
